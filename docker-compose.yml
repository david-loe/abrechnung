services:
  backend:
    build:
      context: ./
      dockerfile: ./backend/Dockerfile.${NODE_ENV}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: always
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      ollama-model:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - ./common:/common:ro
    ports:
      - ${BACKEND_PORT:-8000}:8000
      - ${BACKEND_DEBUG_PORT:-9229}:9229
    env_file:
      - .env

  # Uses ningx in production mode see /frontend/Dockerfile.production
  frontend:
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile.${NODE_ENV}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./frontend:/app
      - ./common:/common:ro
    restart: always
    depends_on:
      - backend
    ports:
      - ${FRONTEND_PORT:-5000}:8080
    env_file:
      - .env
  db:
    image: mongo:8
    command: --quiet --logpath /dev/null
    restart: always
    volumes:
      - db_data:/data/db
    tmpfs:
      - /data/configdb

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--logfile", "/dev/null"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_KV_CACHE_TYPE: q4_0
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30

  ollama-model:
    image: ollama/ollama:0.32.5
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull qwen2.5:0.5b-instruct-q4_0 && ollama run qwen2.5:0.5b-instruct-q4_0 ""
    volumes:
      - ollama_data:/root/.ollama

  # Watch build in development mode
  common:
    build:
      context: ./common
      dockerfile: Dockerfile.${NODE_ENV}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./common:/app

  # Test LDAP only in development mode
  ldap:
    build:
      context: ./dev-tools/ldap
      dockerfile: Dockerfile.${NODE_ENV}
    environment:
      - DEBUG=false

  # Test SMTP + mail client only in development mode
  inbucket:
    build:
      context: ./dev-tools/inbucket
      dockerfile: Dockerfile.${NODE_ENV}
    ports:
      - ${INBUCKET_UI_PORT:-9000}:9000
    environment:
      - INBUCKET_LOGLEVEL=error

  # Test SMTP + mail client only in development mode
  mongo-express:
    build:
      context: ./dev-tools/mongo-express
      dockerfile: Dockerfile.${NODE_ENV}
    depends_on:
      - db
    ports:
      - ${MONGO_EXPRESS_PORT:-8081}:8081
    environment:
      - ME_CONFIG_MONGODB_URL=${MONGO_URL}
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true

volumes:
  db_data:
  redis_data:
  ollama_data:
