services:
  backend:
    build:
      context: ./
      dockerfile: ./backend/Dockerfile.${NODE_ENV}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: always
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      ollama-smoke-test:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - ./common:/common:ro
    ports:
      - ${BACKEND_PORT:-8000}:8000
      - ${BACKEND_DEBUG_PORT:-9229}:9229
    env_file:
      - .env

  # Uses ningx in production mode see /frontend/Dockerfile.production
  frontend:
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile.${NODE_ENV}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./frontend:/app
      - ./common:/common:ro
    restart: always
    depends_on:
      - backend
    ports:
      - ${FRONTEND_PORT:-5000}:8080
    env_file:
      - .env
  db:
    image: mongo:8
    command: --quiet --logpath /dev/null
    restart: always
    volumes:
      - db_data:/data/db
    tmpfs:
      - /data/configdb

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--logfile", "/dev/null"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama:0.32.5
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen3:0.6b"]
    volumes:
      - ollama_data:/root/.ollama

  ollama-smoke-test:
    image: node:24.14-alpine
    restart: "no"
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    environment:
      OLLAMA_SMOKE_BASE_URL: http://ollama:11434/v1
      OLLAMA_SMOKE_MODEL: qwen3:0.6b
    command: ["node", "/smoke-tests/ollama.mjs"]
    volumes:
      - ./backend/smoke-tests:/smoke-tests:ro

  # Watch build in development mode
  common:
    build:
      context: ./common
      dockerfile: Dockerfile.${NODE_ENV}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./common:/app

  # Test LDAP only in development mode
  ldap:
    build:
      context: ./dev-tools/ldap
      dockerfile: Dockerfile.${NODE_ENV}
    environment:
      - DEBUG=false

  # Test SMTP + mail client only in development mode
  inbucket:
    build:
      context: ./dev-tools/inbucket
      dockerfile: Dockerfile.${NODE_ENV}
    ports:
      - ${INBUCKET_UI_PORT:-9000}:9000
    environment:
      - INBUCKET_LOGLEVEL=error

  # Test SMTP + mail client only in development mode
  mongo-express:
    build:
      context: ./dev-tools/mongo-express
      dockerfile: Dockerfile.${NODE_ENV}
    depends_on:
      - db
    ports:
      - ${MONGO_EXPRESS_PORT:-8081}:8081
    environment:
      - ME_CONFIG_MONGODB_URL=${MONGO_URL}
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true

volumes:
  db_data:
  redis_data:
  ollama_data:
