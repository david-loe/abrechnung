version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/backend"
      - "/common"
      - "/frontend"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "dependencies"
      - "npm"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
