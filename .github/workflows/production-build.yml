name: Production Build & Migration

on:
  workflow_call:
    inputs:
      previous-version:
        required: true
        type: string

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: abrechnung
  PREVIOUS_VERSION: ${{ inputs.previous-version }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  production-build:
    name: Production Build & Migration (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-production-env
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./${{ matrix.package }}/Dockerfile.production
          platforms: linux/amd64
          load: true
          tags: abrechnung-${{ matrix.package }}
          cache-from: type=gha,version=2,scope=production-${{ matrix.package }}-amd64
          cache-to: type=gha,version=2,scope=production-${{ matrix.package }}-amd64,mode=max
      - name: Test backend migration
        if: matrix.package == 'backend'
        run: bash .github/scripts/backend-migration.sh
      - name: Extract OpenAPI spec from the production image
        if: matrix.package == 'backend'
        run: |
          container_id="$(docker create abrechnung-backend)"
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/build/dist/swagger.json" "$RUNNER_TEMP/swagger.json"
      - name: Upload OpenAPI spec
        if: matrix.package == 'backend'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/swagger.json
          if-no-files-found: error
          retention-days: 1
      - name: Smoke-test immutable frontend image with runtime configuration
        if: matrix.package == 'frontend'
        run: bash .github/scripts/frontend-smoke.sh
      - name: Install browser test tools on the runner
        if: matrix.package == 'frontend'
        run: |
          npm install --prefix "$RUNNER_TEMP/frontend-migration" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/frontend-migration/node_modules/playwright/cli.js" install --with-deps firefox chromium
      - name: Test production frontend upgrade in Firefox and Chromium
        if: matrix.package == 'frontend'
        env:
          FRONTEND_IMAGE: abrechnung-frontend
        run: bash .github/scripts/frontend-migration.sh
      - name: Stop migration services
        if: ${{ always() && matrix.package == 'backend' }}
        run: docker compose -f deploy-compose.yml down --volumes
