name: Package Tests

on:
  workflow_call:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: abrechnung
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  tests:
    name: Tests (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [backend, common, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-development-env
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build common development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./common
          file: ./common/Dockerfile.development
          load: true
          tags: abrechnung-common
          cache-from: type=gha,version=2,scope=development-common-amd64
          # Only the common test job writes this shared cache.
          cache-to: ${{ matrix.package == 'common' && 'type=gha,version=2,scope=development-common-amd64,mode=max' || '' }}
      - name: Build package development image
        if: matrix.package != 'common'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.package }}/Dockerfile.development
          load: true
          tags: abrechnung-${{ matrix.package }}
          cache-from: type=gha,version=2,scope=development-${{ matrix.package }}-amd64
          cache-to: type=gha,version=2,scope=development-${{ matrix.package }}-amd64,mode=max
      - name: Build common
        if: matrix.package != 'common'
        run: docker compose run --rm --no-deps --pull never common npm run build
      - name: Start backend test services
        if: matrix.package == 'backend'
        run: docker compose up -d db redis ldap inbucket
      - name: Run backend setup and tests with one compilation
        if: matrix.package == 'backend'
        run: docker compose run --rm --no-deps --pull never backend npm test
      - name: Run package tests
        if: matrix.package != 'backend'
        run: docker compose run --rm --no-deps --pull never ${{ matrix.package }} npm run test
      - name: Stop test services
        if: ${{ always() && matrix.package == 'backend' }}
        run: docker compose down --volumes
