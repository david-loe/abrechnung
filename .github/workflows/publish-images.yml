name: Publish Images

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build-platform:
    name: Publish ${{ matrix.package }} (${{ matrix.arch }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: [ backend, frontend ]
        arch: [ amd64, arm64 ]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The caller waits for CI successful before invoking this workflow at all.
      # Push by digest so an incomplete platform matrix cannot update release tags.
      - name: Build and push architecture image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.package }}/Dockerfile.production
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,"name=davidloe/abrechnung-${{ matrix.package }},ghcr.io/david-loe/abrechnung-${{ matrix.package }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,version=2,scope=production-${{ matrix.package }}-${{ matrix.arch }}
          cache-to: type=gha,version=2,scope=production-${{ matrix.package }}-${{ matrix.arch }},mode=max
      - name: Export digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.package }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.txt
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish ${{ matrix.package }} multiarch tags
    needs: [ build-platform ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [ backend, frontend ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-${{ matrix.package }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            davidloe/abrechnung-${{ matrix.package }}
            ghcr.io/david-loe/abrechnung-${{ matrix.package }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Publish and verify multiarch manifests
        env:
          PACKAGE: ${{ matrix.package }}
          META_JSON: ${{ steps.meta.outputs.json }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: bash .github/scripts/publish-manifests.sh
